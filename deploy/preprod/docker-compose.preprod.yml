# API préprod : réutilise encore l'image `anaginosko-api` déjà construite par la
# prod, mais sa configuration, son conteneur, son port et son volume sont séparés.
# La DB db-next est persistante et ne doit jamais être copiée depuis la production.
services:
  api:
    image: anaginosko-api
    container_name: anaginosko-api-next
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3901:3333"
    volumes:
      - db-next:/app/tmp

volumes:
  db-next:
