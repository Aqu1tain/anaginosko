# /etc/nginx/conf.d/anaginosko-crawlers.conf (contexte http)
# Les crawlers de masse tournent sur des centaines d'adresses (IPv6 surtout) : une clé
# par IP ne sert à rien. Chaque famille de robots partage UN seau, appliqué par
# `limit_req zone=anag_crawlers` dans le vhost. Clé vide = jamais limité : visiteurs,
# Googlebot, Bingbot, aperçus de liens (facebookexternalhit, WhatsApp, X…) et
# requêtes déclenchées par un utilisateur (ChatGPT-User, Claude-User, Perplexity-User,
# meta-externalfetcher). Indexation et entraînement ont des seaux distincts : un robot
# d'entraînement ne peut pas affamer le robot de recherche du même éditeur.
# La première expression qui correspond l'emporte : facebookexternalhit reste en tête.
map $http_user_agent $anag_crawler_key {
    default                 "";
    ~*facebookexternalhit   "";
    ~*meta-externalagent    "meta-train";
    ~*meta-externalads      "meta-train";
    ~*meta-webindexer       "meta-search";
    ~*GPTBot                "openai-train";
    ~*OAI-SearchBot         "openai-search";
    ~*ClaudeBot             "anthropic-train";
    ~*Claude-SearchBot      "anthropic-search";
    ~*PerplexityBot         "perplexity";
    ~*Amazonbot             "amazon";
    ~*Amzn-SearchBot        "amazon-search";
    ~*Applebot-Extended     "apple-train";
    ~*CCBot                 "commoncrawl";
    ~*Bytespider            "bytedance";
    ~*DataForSeoBot         "seo-tools";
    ~*AhrefsBot             "seo-tools";
    ~*SemrushBot            "seo-tools";
    ~*MJ12bot               "seo-tools";
    ~*PetalBot              "seo-tools";
}
# Une requête par seconde et par famille : les pages lourdes sont en cache (ISR),
# chaque passage ne coûte presque rien hors du premier rendu après un déploiement.
limit_req_zone $anag_crawler_key zone=anag_crawlers:1m rate=60r/m;
