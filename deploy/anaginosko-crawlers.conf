# /etc/nginx/conf.d/anaginosko-crawlers.conf (contexte http)
# Les crawlers de masse tournent sur des centaines d'adresses (IPv6 surtout) : une clé
# par IP ne sert à rien. Chaque famille de robots partage UN seau, appliqué par
# `limit_req zone=anag_crawlers` dans le vhost. Clé vide = jamais limité : visiteurs
# et moteurs de recherche (Googlebot, Bingbot) ne sont pas concernés.
map $http_user_agent $anag_crawler_key {
    default                 "";
    ~*meta-externalagent    "meta";
    ~*facebookexternalhit   "facebook";
    ~*GPTBot                "openai";
    ~*OAI-SearchBot         "openai";
    ~*ClaudeBot             "anthropic";
    ~*PerplexityBot         "perplexity";
    ~*Bytespider            "bytedance";
    ~*Amazonbot             "amazon";
    ~*CCBot                 "commoncrawl";
}
limit_req_zone $anag_crawler_key zone=anag_crawlers:1m rate=30r/m;
