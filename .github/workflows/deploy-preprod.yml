name: Deploy preprod (next.anaginosko.fr)

on:
  push:
    branches: [next]
  workflow_dispatch:

concurrency:
  group: deploy-preprod
  # false : les déploiements se SÉRIALISENT au lieu de s'annuler. Annuler un run en plein
  # rsync --delete de l'arbre servi laisserait un arbre mixte ancien/nouveau en ligne.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Build (préprod)
        env:
          NEXT_PUBLIC_PREPROD: "1"
          NEXT_PUBLIC_API_BASE: /api
        run: npm run build

      - name: Assemble standalone bundle
        run: |
          set -euo pipefail
          rm -rf deploy-out
          cp -r .next/standalone deploy-out
          mkdir -p deploy-out/.next
          cp -r .next/static deploy-out/.next/static
          rm -rf deploy-out/public
          rsync -a --exclude audio --exclude nt --exclude lxx public/ deploy-out/public/
          # Matérialiseur unique (zéro-perte) + module partagé + fusion arbitrage git<->serveur
          # + gate sentinelle, exécutés côté serveur. git est la SOURCE DE VÉRITÉ de
          # l'arbitrage ; l'ARB_DIR serveur est la copie de travail de Biblion (fusion à 3 règles).
          mkdir -p deploy-out/scripts deploy-out/lib deploy-out/data
          cp scripts/materialize-links.mjs scripts/merge-arb-git-server.mjs scripts/check-sentinelles.mjs deploy-out/scripts/
          cp lib/lxx-materialize.mjs deploy-out/lib/
          cp data/giguet-lxx.json data/lxx-links.json data/lxx-arbitration.json data/lxx-arbitration-gaps.json data/lxx-sentinelles.json deploy-out/data/
          # La préprod lit sa propre data NT/LXX (branche next), pas celle de la prod.
          printf 'NT_DATA_DIR=/var/www/anaginosko-next/nt\nLXX_DATA_DIR=/var/www/anaginosko-next/lxx\n' > deploy-out/.env.production

      - name: Deploy preprod to VPS
        env:
          CERTBOT_EMAIL: corentinfox08@gmail.com
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_ed25519"
          SSHTT="ssh -tt -i ~/.ssh/id_ed25519"  # tty pour sudo (Defaults use_pty)
          HOST="${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}"
          TS=$(date +%Y%m%d%H%M%S)
          REL="/opt/anaginosko-web-next/releases/$TS"

          # 1) Pousser les fichiers de provisioning préprod
          $SSH "$HOST" "rm -rf ~/anag-preprod && mkdir -p ~/anag-preprod"
          rsync -az -e "$SSH" deploy/preprod/ "$HOST:anag-preprod/"

          # 2) Provisionner (idempotent) : service systemd, API isolée + DB copiée
          #    de la prod, nginx + TLS. Aucune ressource prod n'est touchée.
          $SSHTT "$HOST" "CERTBOT_EMAIL='$CERTBOT_EMAIL' bash anag-preprod/provision.sh"

          # 3) Data statique propre à la préprod (NT inchangé, LXX nouvelle)
          rsync -az --delete -e "$SSH" public/nt/  "$HOST:/var/www/anaginosko-next/nt/"
          rsync -az --delete -e "$SSH" public/lxx/ "$HOST:/var/www/anaginosko-next/lxx/"

          # 4) Release Next préprod (bundle standalone immuable)
          $SSH "$HOST" "mkdir -p $REL"
          rsync -az --delete -e "$SSH" deploy-out/ "$HOST:$REL/"
          ARB="/opt/anaginosko-web-next/arbitration"
          # 4a) FUSION arbitrage (git source de vérité <-> ARB_DIR serveur, copie de travail
          #     Biblion). Backup horodaté, puis fusion à 3 règles : git-active installée,
          #     archivée retirée, fraîche Biblion conservée+capturée, CONFLIT bloquant. Un
          #     conflit ou une erreur fait échouer le déploiement (set -e), rien de silencieux.
          #     L'ARB_DIR appartient au service (anag-web). L'utilisateur de déploiement
          #     a sudo passwordless en RUNAS-ROOT (cf. systemctl ci-dessous) mais PAS en
          #     runas-anag-web. On écrit donc en root via $SSHTT + sudo (pattern prouvé du
          #     systemctl : sudo runas-root sous -tt ne deadlocke pas ; c'est runas-USER
          #     qui deadlockait), puis on RESTAURE l'ownership anag-web par chown, pour que
          #     l'outil d'admin de Biblion (anag-web) garde le droit d'écrire son arbitrage.
          $SSHTT "$HOST" "sudo cp $ARB/lxx-arbitration.json $ARB/lxx-arbitration.json.bak.$TS && sudo node $REL/scripts/merge-arb-git-server.mjs --git $REL/data/lxx-arbitration.json --server $ARB/lxx-arbitration.json --out $ARB/lxx-arbitration.json --capture $ARB/biblion-fresh.json --prev $ARB/last-git-arbitration.json && sudo chown anag-web:anag-web $ARB/lxx-arbitration.json $ARB/last-git-arbitration.json $ARB/biblion-fresh.json"
          # Remonte les ajouts frais de Biblion vers le runner (artefact) : ils ne restent
          # PAS un exemplaire unique sur le VPS. À versionner dans git ensuite.
          rsync -az -e "$SSH" "$HOST:$ARB/biblion-fresh.json" ./biblion-fresh.json 2>/dev/null || printf '[]' > ./biblion-fresh.json
          if [ "$(node -e "process.stdout.write(String(JSON.parse(require('fs').readFileSync('./biblion-fresh.json')).length||0))")" != "0" ]; then
            echo "::warning::Biblion a des entrées d'arbitrage non versionnées (voir l'artefact biblion-fresh) - à committer dans git."
          fi
          # Validations manuelles (« c'est bon ») : exemplaire unique sur le VPS, hors
          # fusion. On en fait un backup horodaté et on le remonte en artefact, comme
          # l'arbitrage, pour qu'un crash du VPS ne les perde pas.
          $SSHTT "$HOST" "[ -f $ARB/lxx-biblion-validated.json ] && sudo cp $ARB/lxx-biblion-validated.json $ARB/lxx-biblion-validated.json.bak.$TS || true"
          rsync -az -e "$SSH" "$HOST:$ARB/lxx-biblion-validated.json" ./lxx-biblion-validated.json 2>/dev/null || printf '[]' > ./lxx-biblion-validated.json
          # 4b) Matérialisation COMPLÈTE (matérialiseur unique zéro-perte) depuis l'arbitrage FUSIONNÉ.
          $SSH "$HOST" "cd $REL && ARB_DIR=$ARB LXX_DATA_DIR=/var/www/anaginosko-next/lxx node scripts/materialize-links.mjs --apply"
          # 4c) GATE SENTINELLE : un verset servi par lot de corrections récentes doit contenir
          #     sa sous-chaîne attendue (aurait attrapé la désync du 2026-07-08). Échec = pas de bascule.
          $SSH "$HOST" "cd $REL && LXX_DATA_DIR=/var/www/anaginosko-next/lxx node scripts/check-sentinelles.mjs"
          # 4d) L'arbre lxx servi passe au service (anag-web) pour qu'applyToReader
          #     réécrive fr.json EN DIRECT quand Biblion arbitre (sinon EACCES : arbre
          #     possédé par le CI, cf. provision.sh). provision.sh le rechown au CI au
          #     prochain déploiement, avant le rsync. Même pattern que l'ARB_DIR (l.89).
          $SSHTT "$HOST" "sudo chown -R anag-web:anag-web /var/www/anaginosko-next/lxx"
          $SSHTT "$HOST" "ln -sfn $REL /opt/anaginosko-web-next/current && sudo systemctl restart anaginosko-web-next"
          $SSH "$HOST" "ls -1dt /opt/anaginosko-web-next/releases/*/ | tail -n +4 | xargs -r rm -rf"

          # 5) Smoke-test local sur le VPS
          $SSH "$HOST" "curl -fsS -o /dev/null http://127.0.0.1:3101/ && echo 'préprod OK'"

      # Remontée des ajouts frais de Biblion (fin du cul-de-sac serveur) : téléchargeable
      # depuis le run, à versionner dans git. always() : même si un gate échoue en amont.
      - name: Artefact biblion-fresh (arbitrage non versionné)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biblion-fresh
          path: |
            biblion-fresh.json
            lxx-biblion-validated.json
          if-no-files-found: ignore
